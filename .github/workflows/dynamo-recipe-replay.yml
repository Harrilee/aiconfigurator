name: "Dynamo Recipe Replay"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dynamo-recipe-replay-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  replay:
    name: Adapted recipe estimate gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout AIC
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false

      - name: Checkout live Dynamo main
        uses: actions/checkout@v5
        with:
          repository: ai-dynamo/dynamo
          ref: main
          path: dynamo-upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AIC
        run: |
          python -m pip install --upgrade pip
          if grep -q 'build-backend = "maturin"' aic-core/pyproject.toml 2>/dev/null; then
            python -m pip install -e aic-core
          fi
          python -m pip install -e ".[dev]"

      - name: Replay Dynamo recipes
        id: replay
        continue-on-error: true
        run: |
          python -m tools.dynamo_recipe_ci.runner \
            --dynamo-root dynamo-upstream \
            --output-dir /tmp/dynamo-recipe-replay \
            --jobs 4 \
            --timeout-seconds 300

      - name: Add job summary
        if: always()
        run: |
          if [ -f /tmp/dynamo-recipe-replay/summary.md ]; then
            cat /tmp/dynamo-recipe-replay/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Dynamo recipe replay did not produce a summary"
          fi

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dynamo-recipe-replay
          path: /tmp/dynamo-recipe-replay
          if-no-files-found: error
          retention-days: 30

      - name: Comment on failed pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dynamo-recipe-replay -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (process.env.REPLAY_OUTCOME === 'success') {
              if (previous) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id });
              }
              return;
            }

            const summaryPath = '/tmp/dynamo-recipe-replay/comment.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'The replay failed before it could produce a structured summary.';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              summary,
              `[Workflow run](${runUrl}) · [Full JSON and Markdown report](${runUrl}#artifacts)`,
            ].join('\n\n');

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce replay gate
        if: always()
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          if [ "${REPLAY_OUTCOME}" != "success" ]; then
            echo "::error::One or more successfully adapted Dynamo recipes did not return a valid estimate"
            exit 1
          fi
