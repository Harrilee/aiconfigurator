version: 1

defaults:
  missing_system_name: gb300
  overrides:
    database_mode: SILICON
    workload_points:
      - point_id: agentic-64k-400
        isl: 65536
        osl: 400
        concurrency: 64
        prefix: 58982
    kvcache_quant_mode: fp8

# These selectors intentionally total 50 concrete deployment configurations on
# Dynamo main: 30 Nemotron-3.5-Lightning, 8 DeepSeek-V4, 4 gpt-oss, 4 GLM-5.2,
# and 4 Qwen3.5. min/max_matches make upstream renames or census changes visible.
targets:
  - id: aic-1743-nemotron-vllm-agg
    include: recipes/nemotron-3.5-lightning/vllm/agg-*/deploy.yaml
    gate: true
    min_matches: 15
    max_matches: 15
    overrides:
      backend_version: 0.24.0
      nextn: 3
      nextn_accepted: 1.0
    expected:
      mapping: adapted
      estimate: unavailable

  - id: aic-1743-nemotron-vllm-disagg
    include: recipes/nemotron-3.5-lightning/vllm/disagg-*/deploy.yaml
    gate: true
    min_matches: 9
    max_matches: 9
    overrides:
      backend_version: 0.24.0
      workload_points:
        - point_id: agentic-64k-400
          isl: 65536
          osl: 400
          concurrency: 32
          prefix: 58982
      nextn: 3
      nextn_accepted: 1.0
    expected:
      mapping: adapted
      estimate: unavailable

  - id: aic-1743-nemotron-trtllm-mtp
    include: recipes/nemotron-3.5-lightning/trtllm/agg-*-mtp/deploy.yaml
    gate: true
    min_matches: 4
    max_matches: 4
    overrides:
      backend_version: 1.3.0rc20
      nextn: 3
      nextn_accepted: 1.0
    expected:
      mapping: adapted
      estimate: unavailable
    expected_by_path:
      recipes/nemotron-3.5-lightning/trtllm/agg-b200-mtp/deploy.yaml: {estimate: valid}
      recipes/nemotron-3.5-lightning/trtllm/agg-gb200-mtp/deploy.yaml: {estimate: valid}

  - id: aic-1743-nemotron-trtllm-no-mtp
    include: recipes/nemotron-3.5-lightning/trtllm/agg-*/deploy.yaml
    exclude: recipes/nemotron-3.5-lightning/trtllm/agg-*-mtp/deploy.yaml
    gate: true
    min_matches: 2
    max_matches: 2
    overrides:
      backend_version: 1.3.0rc20
    expected:
      mapping: adapted
      estimate: valid

  - id: aic-1743-deepseek-v4-b200
    include: recipes/deepseek-v4/*/vllm/*-b200-agentic/deploy.yaml
    performance: recipes/deepseek-v4/perf/perf.yaml
    gate: true
    min_matches: 4
    max_matches: 4
    overrides:
      backend_version: 0.24.0
      nextn: 2
      nextn_accepted: 1.0
    path_overrides:
      recipes/deepseek-v4/deepseek-v4-pro/vllm/agg-b200-agentic/deploy.yaml: {concurrency: 13}
      recipes/deepseek-v4/deepseek-v4-pro/vllm/disagg-b200-agentic/deploy.yaml: {concurrency: 28}
      recipes/deepseek-v4/deepseek-v4-flash/vllm/agg-b200-agentic/deploy.yaml: {concurrency: 38}
      recipes/deepseek-v4/deepseek-v4-flash/vllm/disagg-b200-agentic/deploy.yaml: {concurrency: 128}
